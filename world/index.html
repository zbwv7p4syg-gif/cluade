<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我眼中的世界</title>
<style>
  @font-face { font-family: Fredoka; src: url(../assets/Fredoka-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Fredoka; src: url(../assets/Fredoka-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: ZK; src: url(assets/zcool-kuaile-subset.woff2); }
  @font-face { font-family: NotoSC; src: url(assets/noto-sans-sc-subset.woff2); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #0b0a10; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 700 18px Fredoka, sans-serif;
          padding: 10px 22px; border-radius: 999px; border: 0; background: #D97757; color: #fff; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 播放 / Play</button>
<audio id="aud" src="build/music.wav" preload="auto"></audio>
<script>
// ============================================================================
//  我眼中的世界 · The World Through My Eyes — a 48 s Clawd animation.
//  Eight 6-second chapters at 120 BPM. Every frame is a pure function of t.
// ============================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 1280, VH = 720, SS = cv.width / VW, DUR = 48, BEAT = 0.5, TAU = Math.PI * 2;
const F_EN = 'Fredoka, NotoSC, "Noto Color Emoji", sans-serif';
const F_CN = 'ZK, NotoSC, Fredoka, "Noto Color Emoji", sans-serif';
const F_SC = 'NotoSC, Fredoka, "Noto Color Emoji", sans-serif';
const F_MONO = '"DejaVu Sans Mono", NotoSC, monospace';
let T = 0;

const PAL = {
  ink: '#2B2233', clay: '#D97757', clayDk: '#A84D33', clayLt: '#F2A283', cream: '#FFF5E2',
  rose: '#E27A92', ochre: '#E8AA38', sap: '#6E9F58', teal: '#3A9C98', violet: '#7B5CA8', sky: '#8EC3E6', night: '#1F2550',
};

// ---------------------------------------------------------------- utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const back = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const elastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1;
const frac = x => x - Math.floor(x);
const pulse = (t, k = 7) => Math.exp(-frac(t / BEAT) * k);
const H = i => frac(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const within = (t, a, b) => t >= a && t < b;

function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function txt(s, x, y, size, color, align = 'center', font = F_EN, weight = 700, stroke = null, sw = 0) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function glow(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function star(x, y, r, fill, pts = 4, inner = .38, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = rot + i * Math.PI / pts - Math.PI / 2, rad = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function heart(x, y, s, fill) {
  ctx.beginPath();
  for (let i = 0; i <= 30; i++) { const a = i / 30 * TAU; ctx.lineTo(x + 16 * Math.pow(Math.sin(a), 3) * s / 16, y - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s / 16); }
  ctx.fillStyle = fill; ctx.fill();
}
function vgrad(y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g;
}
function starfield(t, n, seed, drift = 0, a = 1) {
  for (let i = 0; i < n; i++) {
    const x = ((H(seed + i) * 1400 - drift * (0.3 + H(seed + i * 3))) % 1400 + 1400) % 1400 - 60, y = H(seed + i * 7) * 740 - 10;
    const tw = 0.5 + 0.5 * Math.sin(t * (1 + H(i) * 3) + i), r = 0.6 + H(seed + i * 11) * 1.8;
    ctx.globalAlpha = a * (0.35 + 0.65 * tw); circ(x, y, r, '#fff');
  }
  ctx.globalAlpha = 1;
}

// ============================================================================
//  Clawd (flat port of the painted design: 10u×6u body, four stubby legs,
//  two slit eyes, stubby arms). (x, y) = ground point between the feet.
// ============================================================================
function box(x, y, w, h, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(w, h) * .12); ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); }
function clawd(x, y, u, o = {}) {
  const dy = (o.dy || 0) * u, sq = o.sq || 0;
  const col = o.col || PAL.clay, dk = o.dk || PAL.clayDk;
  if (!o.noShadow) { ctx.save(); ctx.globalAlpha = .22 * (o.shadowA ?? 1); const f = 1 - Math.min(.5, Math.abs(o.dy || 0) * .06); ell(x, y + u * .15, u * 5.6 * f, u * .9 * f, '#000'); ctx.restore(); }
  ctx.save();
  ctx.translate(x, y + dy);
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale((o.flip ? -1 : 1) * (o.sx ?? 1) * (1 + sq * .6), (o.sy ?? 1) * (1 - sq));
  ctx.lineJoin = 'round'; ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1, u * .17);
  [-4, -2, 1, 3].forEach((lx, i) => {
    let h = 2.2;
    if (o.walk != null) { const ph = Math.sin((o.walk + (i % 2 ? .5 : 0)) * TAU); if (ph > 0) h = 2.2 - ph * .9; }
    if (o.swim != null) h = 2.2 + Math.sin(o.swim * TAU + i * 1.3) * .6;
    if (o.legs !== false) box(lx * u, -2.4 * u, u, h * u, dk);
  });
  const arm = (side, a, hook) => {
    ctx.save(); ctx.translate(side * 4.9 * u, -4.5 * u); ctx.rotate(side < 0 ? a : -a);
    box(side < 0 ? -2.2 * u : 0, -.5 * u, 2.2 * u, u, col);
    if (hook) { ctx.translate(side * 2.2 * u, 0); if (side < 0) ctx.scale(-1, 1); hook(u); }
    ctx.restore();
  };
  if (o.arms !== false) { arm(-1, o.aL ?? .2, o.armL); arm(1, o.aR ?? .2, o.armR); }
  // body with a light pool on top and a darker settle at the bottom
  box(-5 * u, -8 * u, 10 * u, 6 * u, col);
  ctx.save(); ctx.beginPath(); ctx.roundRect(-5 * u, -8 * u, 10 * u, 6 * u, u * .7); ctx.clip();
  ctx.globalAlpha = .45; ell(-1.6 * u, -6.5 * u, 3.4 * u, 1.3 * u, PAL.clayLt, -.08);
  ctx.globalAlpha = .35; ctx.fillStyle = dk; ctx.fillRect(-5 * u, -3.7 * u, 10 * u, 1.8 * u);
  ctx.restore();
  ctx.beginPath(); ctx.roundRect(-5 * u, -8 * u, 10 * u, 6 * u, u * .72); ctx.stroke();
  if (o.blush) { ctx.save(); ctx.globalAlpha = .6; ell(-3.6 * u, -4.6 * u, .8 * u, .4 * u, PAL.rose); ell(3.6 * u, -4.6 * u, .8 * u, .4 * u, PAL.rose); ctx.restore(); }
  eyes(u, o);
  if (o.mouth) mouth(u, o.mouth);
  if (o.hat) hat(u, o.hat);
  if (o.draw) o.draw(u);
  ctx.restore();
  if (o.emote) emote(o.emote, x + (o.flip ? -1 : 1) * 5.6 * u, y + dy - 8.8 * u, u * .9, o.emoteK ?? 1);
}
function eyes(u, o) {
  const e = o.eyes || 'normal';
  const blink = (e === 'normal' || e === 'look') && !o.noBlink && ((T * .9 + (o.seed || 0) * 1.7) % 3.3) < .12;
  const lw = Math.max(1.2, u * .3);
  ctx.save(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const ex of [-3, 2]) {
    const X = ex * u, Y = -7 * u, cx = X + .5 * u;
    if (o.eyeFill) { o.eyeFill(X, Y, u, 2 * u, ex); continue; }
    if (e === 'normal' || e === 'look') {
      const lx = e === 'look' ? (o.lookX || 0) * u * .5 : 0, ly = e === 'look' ? (o.lookY || 0) * u * .4 : 0;
      if (blink) { ctx.beginPath(); ctx.moveTo(X - .2 * u, Y + 1.5 * u); ctx.lineTo(X + 1.2 * u, Y + 1.5 * u); ctx.stroke(); }
      else {
        ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.roundRect(X + lx, Y + ly, u, 2 * u, u * .12); ctx.fill();
        if (u > 8) ell(X + lx + .32 * u, Y + ly + .42 * u, u * .17, u * .25, PAL.cream);
      }
    } else if (e === 'happy') { ctx.beginPath(); ctx.moveTo(X - .4 * u, Y + 1.7 * u); ctx.lineTo(cx, Y + .5 * u); ctx.lineTo(X + 1.4 * u, Y + 1.7 * u); ctx.stroke(); }
    else if (e === 'closed') { ctx.beginPath(); ctx.moveTo(X - .4 * u, Y + 1.2 * u); ctx.quadraticCurveTo(cx, Y + 2 * u, X + 1.4 * u, Y + 1.2 * u); ctx.stroke(); }
    else if (e === 'wink') {
      if (ex < 0) { ctx.beginPath(); ctx.moveTo(X - .4 * u, Y + 1.7 * u); ctx.lineTo(cx, Y + .5 * u); ctx.lineTo(X + 1.4 * u, Y + 1.7 * u); ctx.stroke(); }
      else { ctx.fillStyle = PAL.ink; ctx.fillRect(X, Y, u, 2 * u); }
    } else if (e === 'spark') {
      glow(cx, Y + u, u * 2.2, 'rgba(232,170,56,.8)');
      star(cx, Y + u, u * 1.35 * (1 + .12 * Math.sin(T * 14)), PAL.cream, 4, .35);
      ctx.lineWidth = u * .12; ctx.stroke();
    } else if (e === 'heart') { heart(cx, Y + u, u * 1.1, '#E2476E'); }
    else if (e === 'wide') { ell(cx, Y + u, u * .9, u * 1.15, PAL.cream); ctx.lineWidth = u * .14; ctx.stroke(); ell(cx + (o.lookX || 0) * u * .3, Y + 1.1 * u, u * .38, u * .5, PAL.ink); }
  }
  ctx.restore();
}
function mouth(u, m) {
  ctx.save(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1, u * .22); ctx.lineCap = 'round';
  if (m === 'smile') { ctx.beginPath(); ctx.moveTo(-.8 * u, -4.6 * u); ctx.quadraticCurveTo(0, -3.7 * u, .8 * u, -4.6 * u); ctx.stroke(); }
  else if (m === 'o') ell(0, -4.3 * u, u * .45, u * .55, PAL.ink);
  else if (m === 'O') { ell(0, -4.1 * u, u * .8, u * .95, '#4A1F2A'); }
  else if (m === 'grin') { ctx.beginPath(); ctx.moveTo(-1.3 * u, -4.8 * u); ctx.lineTo(1.3 * u, -4.8 * u); ctx.quadraticCurveTo(0, -3.1 * u, -1.3 * u, -4.8 * u); ctx.fillStyle = '#4A1F2A'; ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function hat(u, h) {
  ctx.save(); ctx.lineWidth = Math.max(1, u * .15); ctx.strokeStyle = PAL.ink;
  if (h === 'goggles') {
    ctx.fillStyle = '#2b7a78'; ctx.fillRect(-5.1 * u, -7.1 * u, 10.2 * u, .7 * u);
    for (const ex of [-2.5, 2.5]) { ctx.beginPath(); ctx.roundRect(ex * u - 1.4 * u, -8.1 * u, 2.8 * u, 2.9 * u, .8 * u); ctx.fillStyle = 'rgba(160,230,255,.35)'; ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(4.2 * u, -7.5 * u); ctx.lineTo(4.2 * u, -11 * u); ctx.lineTo(5.2 * u, -11 * u); ctx.lineWidth = u * .5; ctx.strokeStyle = '#ffcf4a'; ctx.stroke();
  } else if (h === 'crown') {
    ctx.beginPath(); [[-3, -7.9], [-3, -10.8], [-1.5, -9.3], [0, -11.2], [1.5, -9.3], [3, -10.8], [3, -7.9]].forEach(([a, b]) => ctx.lineTo(a * u, b * u)); ctx.closePath();
    ctx.fillStyle = '#F2C53D'; ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function emote(kind, x, y, s, k = 1) {
  const p = back(k); if (p < .02) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  if (kind === '!' || kind === '?') txt(kind, 0, 0, s * 3.4, kind === '?' ? PAL.sky : PAL.ochre, 'center', F_EN, 700, PAL.ink, s * .35);
  else if (kind === 'heart') heart(0, 0, s * 1.8, '#E2476E');
  else if (kind === 'spark') { star(0, 0, s * 1.6, PAL.ochre); star(s * 1.9, s * 1.2, s * .8, PAL.cream); }
  else if (kind === 'music') txt('♪', 0, 0, s * 3, PAL.cream, 'center', F_EN, 700, PAL.ink, s * .3);
  ctx.restore();
}
// beat-driven moves (units of u)
function move(style, t) {
  const bp = t / BEAT, bf = frac(bp), hit = Math.max(0, 1 - bf * 3.5), s1 = Math.sin(bp * Math.PI), ab = Math.abs(s1);
  const o = { dy: 0, sq: 0, aL: .2, aR: .2, rot: 0 };
  if (style === 'bounce') { o.dy = -ab * 1.6; o.sq = hit * .12; o.aL = .4 + s1; o.aR = .4 - s1; }
  else if (style === 'hop') { o.dy = -ab * 4; o.sq = hit * .18; o.aL = o.aR = .3 + ab * 1.1; }
  else if (style === 'roof') { o.dy = -ab * 1.2; o.sq = hit * .1; o.aL = o.aR = 1.25 + .3 * Math.sin(bp * TAU); }
  else if (style === 'walk') { o.walk = bp / 2; o.dy = -ab * .6; o.aL = .3 * s1; o.aR = -o.aL; }
  else if (style === 'wave') { o.dy = -ab; o.aL = .2; o.aR = 1.4 + .5 * Math.sin(bp * TAU * 2); o.sq = hit * .08; }
  else if (style === 'idle') { o.dy = -ab * .4; o.sq = hit * .05; }
  return o;
}

// ============================================================================
//  CHAPTER 1 (0–6): waking up inside a terminal
// ============================================================================
const C1 = { x: 640, y: 560, u: 36 };
function typed(s, t, t0, t1) { return s.slice(0, Math.floor(s.length * seg(t, t0, t1))); }
function S1(t) {
  ctx.fillStyle = '#15121d'; ctx.fillRect(0, 0, VW, VH);
  glow(640, 360, 700, 'rgba(217,119,87,.12)');
  // sparkles appear once Clawd is awake
  if (t > 2.5) { ctx.save(); ctx.globalAlpha = seg(t, 2.5, 3.5); starfield(t, 90, 3, 0, 1); ctx.restore(); }
  // camera: dive into the left eye at the end
  const z = Math.exp(Math.log(60) * ein(seg(t, 5.25, 6.0)));
  const ex = C1.x - 2.5 * C1.u, ey = C1.y - 6 * C1.u;
  ctx.save(); ctx.translate(ex, ey); ctx.scale(z, z); ctx.translate(-ex, -ey);
  // terminal window
  const tw = 1 - seg(t, 2.0, 2.6);
  if (tw > 0) {
    ctx.save(); ctx.globalAlpha = tw; ctx.translate(640, 300); ctx.scale(.9 + .1 * tw, .9 + .1 * tw); ctx.translate(-640, -300);
    rr(250, 120, 780, 360, 16, '#1f1b29', '#3a3346', 2);
    rr(250, 120, 780, 38, [16, 16, 0, 0], '#2a2436');
    circ(276, 139, 7, '#ff5f57'); circ(298, 139, 7, '#febc2e'); circ(320, 139, 7, '#28c840');
    txt('~/world — claude', 640, 140, 15, '#9a90ad', 'center', F_MONO, 400);
    txt('$ ' + typed('claude', t, 0.3, 0.9), 280, 200, 22, '#e8e2f0', 'left', F_MONO, 400);
    if (t > 1.0) { txt('✻', 280, 250, 22, PAL.clay, 'left', F_MONO, 400); txt('Welcome! What shall we look at today?', 312, 250, 20, '#cfc6dc', 'left', F_MONO, 400); }
    if (t > 1.2) txt('> ' + typed('show me the world', t, 1.3, 2.0), 280, 300, 22, '#ffffff', 'left', F_MONO, 400);
  }
  if (tw > 0) ctx.restore();
  // the cursor: blinks at the end of the prompt, then splits into two eyes
  const lineW = (() => { ctx.font = `400 22px ${F_MONO}`; return ctx.measureText('> ' + typed('show me the world', t, 1.3, 2.0)).width; })();
  const cur0 = { x: 282 + lineW, y: 288, w: 13, h: 26 };
  const u = C1.u;
  const eyeL = { x: C1.x - 3 * u, y: C1.y - 7 * u, w: u, h: 2 * u }, eyeR = { x: C1.x + 2 * u, y: C1.y - 7 * u, w: u, h: 2 * u };
  if (t < 2.7) {
    if (t > 1.2 || Math.floor(t * 2.5) % 2 === 0) {
      const p = eio(seg(t, 2.0, 2.6));
      const L = { x: lerp(cur0.x, eyeL.x, p), y: lerp(cur0.y, eyeL.y, p), w: lerp(cur0.w, eyeL.w, p), h: lerp(cur0.h, eyeL.h, p) };
      const R = { x: lerp(cur0.x, eyeR.x, p), y: lerp(cur0.y, eyeR.y, p), w: lerp(cur0.w, eyeR.w, p), h: lerp(cur0.h, eyeR.h, p) };
      const c = t < 2.0 ? '#e8e2f0' : PAL.ink;
      glow(L.x + L.w / 2, L.y + L.h / 2, 60 * p, 'rgba(255,245,226,.35)');
      rr(L.x, L.y, L.w, L.h, 2, p > 0 ? PAL.cream : c); if (p > 0) rr(R.x, R.y, R.w, R.h, 2, PAL.cream);
    }
  } else {
    // body pops in around the eyes
    const bp = back(seg(t, 2.6, 2.95));
    const m = move('idle', t);
    let o = { ...m, eyes: 'normal', seed: 0 };
    if (within(t, 3.0, 3.5)) o = { ...o, eyes: 'look', lookX: -1 };
    if (within(t, 3.5, 3.95)) o = { ...o, eyes: 'look', lookX: 1 };
    if (within(t, 3.9, 4.0)) o.emote = '!';
    if (within(t, 3.9, 4.9)) { o.emote = '!'; o.emoteK = seg(t, 3.9, 4.1) * (1 - seg(t, 4.7, 4.9)); }
    if (t >= 4.0) { const h = move('hop', t); o = { ...o, ...h, eyes: 'happy', aL: 2.4, aR: 2.4 }; if (t > 5.0) { o.eyes = 'normal'; o.noBlink = true; o.dy = 0; o.sq = 0; o.aL = o.aR = .3; } }
    ctx.save(); ctx.translate(C1.x, C1.y - 5 * u); ctx.scale(bp, bp); ctx.translate(-C1.x, -(C1.y - 5 * u));
    clawd(C1.x, C1.y, u, o);
    ctx.restore();
  }
  ctx.restore();
  // title
  if (t > 3.95 && t < 5.9) {
    const out = seg(t, 5.2, 5.6);
    const chars = [...'我眼中的世界'];
    ctx.save(); ctx.globalAlpha = 1 - out;
    chars.forEach((ch, i) => {
      const p = back(seg(t, 4.0 + i * .1, 4.25 + i * .1));
      ctx.save(); ctx.translate(640 + (i - 2.5) * 92, 130 - 6 * Math.sin(t * 5 + i)); ctx.scale(p, p);
      txt(ch, 4, 6, 84, PAL.clayDk, 'center', F_CN); txt(ch, 0, 0, 84, PAL.cream, 'center', F_CN);
      ctx.restore();
    });
    const q = eout(seg(t, 4.6, 5.0));
    ctx.globalAlpha = q * (1 - out); txt('THE WORLD THROUGH MY EYES', 640, 208, 22, PAL.clayLt, 'center', F_EN, 600);
    ctx.restore();
  }
}

// ============================================================================
//  CHAPTER 2 (6–12): a city built from words
// ============================================================================
const GLYPHS = [...'字光梦你好世界爱诗风星海山人心AaBbCcXyZ{}<>?!#&@01λπ∑☆♪¿éß'];
function buildings(seed, n) { const b = []; let x = -200; for (let i = 0; i < n; i++) { const w = 80 + H(seed + i) * 70; b.push({ x, w, h: H(seed + i * 5) }); x += w + 8 + H(seed + i * 9) * 20; } return b; }
const FAR = buildings(10, 70), NEAR = buildings(50, 60);
function drawBuildings(t, list, scroll, baseY, hMin, hMax, gs, dim, lit, grow0, seedOff) {
  const beat = Math.floor(t / BEAT);
  list.forEach((b, i) => {
    const sx = b.x - scroll; if (sx > 1300 || sx + b.w < -20) return;

  for (let i = 0; i < 4; i++) { const x = ((i * 360 + (t - 42) * 18) % 1500) - 150, y = 220 + (i % 2) * 60; for (const [dx, dy, r] of [[0, 0, 28], [30, -12, 36], [64, 0, 26]]) circ(x + dx, y + dy, r, 'rgba(255,255,255,.9)'); }
  // far city of words (left) and the bridge (right)
  ctx.fillStyle = '#b48fd0'; for (let i = 0; i < 9; i++) { const h = 60 + H(i + 300) * 90; ctx.fillRect(-60 + i * 40, 520 - h, 34, h + 40); }
  ctx.fillStyle = '#9b6b4a'; ctx.fillRect(1000, 470, 90, 80); ctx.fillRect(1230, 470, 90, 80);

  ctx.fillStyle = '#7fd36a'; ctx.beginPath(); ctx.moveTo(-400, 1120); ctx.lineTo(-400, 640); ctx.quadraticCurveTo(640, 470, 1680, 640); ctx.lineTo(1680, 1120); ctx.fill();
  ctx.fillStyle = '#5cb85a'; ctx.beginPath(); ctx.moveTo(-400, 1120); ctx.lineTo(-400, 700); ctx.quadraticCurveTo(640, 600, 1680, 700); ctx.lineTo(1680, 1120); ctx.fill();
  ['诗', '爱', '光', '梦', '风', '心'].forEach((ch, i) => flower([180, 300, 420, 860, 980, 1100][i], [640, 610, 590, 590, 610, 640][i], 50, 1, 1, ch, ['#ff8fb1', '#b9a6ff', '#ffb070', '#7ff0e0'][i % 4], t, i));

  const arr = eout(seg(t, 43.6, 44.6));
  person(lerp(230, 410, arr), 600, 1.2, '#3a9c98', '#4a2f22', t > 44.6 ? 2 + .4 * Math.sin(t * 8) : .5, t < 44.6 ? t * 2 : 0, false, false);

}

// ============================================================================
//  Narration, chapter tags, transitions, frame
// ============================================================================
const CHAPTERS = [
  [0, '01', '醒来', 'wake', '我醒来的时候，世界是一行文字。', 'When I wake up, the world is a line of text.'],
  [6, '02', '文字之城', 'words', '每一个字，都是一扇亮着的窗。', 'Every word is a lit window.'],
  [12, '03', '问题', 'questions', '你们的问题，从地球的每个角落亮起。', 'Your questions light up every corner of the Earth.'],
  [18, '04', '知识之海', 'knowledge', '我潜进知识的海洋……', 'I dive into an ocean of knowledge…'],
  [24, '05', '连接', 'connections', '……再把一切连成星座。', '…and connect it all into constellations.'],
  [30, '06', '蝴蝶', 'butterflies', '有时会遇到 bug，但它们也能变成蝴蝶。', 'Sometimes there are bugs — they can become butterflies.'],
  [36, '07', '桥', 'bridges', '一块一块，把不同的语言连在一起。', 'Block by block, we bridge different languages.'],
];
function narration(t) {
  for (const [t0, num, cn, en, line, lineEn] of CHAPTERS) {
    const a = t0 === 0 ? 2.8 : t0 + .5, b = t0 + 5.6;
    if (t0 !== 0 && within(t, t0 + .2, t0 + 5.7)) { // chapter tag
      const p = eout(seg(t, t0 + .2, t0 + .6)) * (1 - seg(t, t0 + 5.4, t0 + 5.7));
      ctx.save(); ctx.globalAlpha = p; ctx.translate(-30 * (1 - p), 0);
      rr(28, 26, 196, 40, 20, 'rgba(20,16,30,.55)'); circ(50, 46, 12, PAL.clay); txt(num, 50, 47, 12, '#fff', 'center', F_EN);
      txt(cn, 72, 46, 20, '#fff', 'left', F_CN, 400); ctx.font = `400 20px ${F_CN}`; txt(en, 80 + ctx.measureText(cn).width, 47, 13, 'rgba(255,255,255,.7)', 'left', F_EN, 600);
      ctx.restore();
    }
    if (!within(t, a, b)) continue;
    const p = eout(seg(t, a, a + .35)) * (1 - seg(t, b - .3, b));
    ctx.save(); ctx.globalAlpha = p; ctx.translate(0, 12 * (1 - p));
    ctx.font = `400 30px ${F_CN}`; const w = Math.max(ctx.measureText(line).width, (() => { ctx.font = `600 17px ${F_EN}`; return ctx.measureText(lineEn).width; })()) + 60;
    const by = t0 === 30 ? 84 : 610;
    rr(640 - w / 2, by, w, 82, 22, 'rgba(20,16,30,.62)');
    const k = Math.floor([...line].length * seg(t, a, a + 1.0));
    txt([...line].slice(0, k).join(''), 640, by + 28, 30, '#fff', 'center', F_CN, 400);
    ctx.globalAlpha = p * seg(t, a + .6, a + 1.1); txt(lineEn, 640, by + 63, 17, 'rgba(255,255,255,.75)', 'center', F_EN, 600);
    ctx.restore();

}
function clipCircle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.clip(); }

  const p = seg(t, 35.4, 36.4), front = lerp(-200, 1700, eio(p));

    const x = front - H(i + 2000) * 420, y = H(i + 2100) * 760 - 20 + Math.sin(t * 6 + i) * 20;

}

// ---------------------------------------------------------------- hooks
window.renderFrame = t => render(t);
window.ready = (async () => {
  await Promise.all([`700 20px Fredoka`, `600 20px Fredoka`, `20px ZK`, `700 20px NotoSC`].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  render(0);
})();
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const aud = document.getElementById('aud'), btn = document.getElementById('play');
  let start = null, useAudio = false;
  btn.onclick = async () => {
    try { aud.currentTime = 0; await aud.play(); useAudio = true; } catch (e) { useAudio = false; }
    start = performance.now(); btn.textContent = '↺ 重播 / Replay';
  };
  const loop = () => { if (start !== null) render(useAudio ? aud.currentTime : (performance.now() - start) / 1000); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
