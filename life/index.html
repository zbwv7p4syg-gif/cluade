<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生的意义</title>
<style>
  @font-face { font-family: NotoSerifSC; src: url(assets/noto-serif-sc.woff2); font-weight: 200 900; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 700 18px NotoSerifSC, serif;
          padding: 10px 24px; border-radius: 999px; border: 0; background: #ffd9a0; color: #1a1420; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 播放</button>
<script src="src/score.js"></script>
<script src="src/audio.js"></script>
<script src="src/visuals.js"></script>
<script>
const cv = document.getElementById('c'), c2d = cv.getContext('2d'), SCALE = cv.width / VW;
window.renderFrame = t => drawFrame(c2d, t, SCALE);
window.ready = (async () => {
  await Promise.all(['400', '700', '900'].map(w => document.fonts.load(`${w} 40px NotoSerifSC`, '人生的意义')));
  drawFrame(c2d, 0, SCALE);
})();
// renderer hook: the soundtrack as 16-bit interleaved PCM, base64
window.renderAudioBase64 = async () => {
  const buf = await renderSoundtrack(44100), L = buf.getChannelData(0), R = buf.getChannelData(1);
  // peak-normalise to -1 dBFS (a pure gain change: timing is untouched, nothing clips)
  let peak = 0; for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const k = 0.891 / peak, pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { pcm[2 * i] = L[i] * k * 32767; pcm[2 * i + 1] = R[i] * k * 32767; }
  const bytes = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
// calibration: one isolated hit of each kind, synthesized by the same instruments, mono base64
window.renderReference = async kind => {
  const ev = { kick: { kick: [{ t: 0.2, g: 1 }] }, softkick: { kick: [{ t: 0.2, g: 0.55, soft: true }] }, heart: { heart: [{ t: 0.2, strong: true }] } }[kind];
  const buf = await renderSoundtrack(44100, ev, 1.0), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const pcm = new Int16Array(L.length); for (let i = 0; i < L.length; i++) pcm[i] = Math.max(-1, Math.min(1, (L[i] + R[i]) / 2)) * 32767;
  const bytes = new Uint8Array(pcm.buffer); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.scoreTimes = () => JSON.parse(JSON.stringify(SCORE));
if (location.search.includes('render')) document.body.classList.add('render');
else {
  // live preview: synthesize once, then play it and draw from the audio clock
  const btn = document.getElementById('play');
  let ac = null, buffer = null, t0 = 0;
  btn.onclick = async () => {
    btn.textContent = '合成音乐中…';
    buffer = buffer || await renderSoundtrack(44100);
    ac = ac || new AudioContext();
    const src = ac.createBufferSource(); src.buffer = buffer; src.connect(ac.destination);
    t0 = ac.currentTime + 0.05; src.start(t0); btn.textContent = '↺ 重播';
  };
  const loop = () => { if (ac) drawFrame(c2d, Math.min(DUR, ac.currentTime - t0), SCALE); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
