<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小宇 · 纸片 MV</title>
<style>
  @font-face { font-family: XiaoyuPaper; src: url(assets/xiaoyu-paper-subset.woff2); }
  html, body { margin: 0; height: 100%; background: #1A1418; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 24px XiaoyuPaper, sans-serif;
          padding: 8px 22px; border: 0; border-radius: 6px; background: #FBF4E6; color: #3A2E3A; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 播放</button>
<audio id="aud" src="build/bgm.wav" preload="auto"></audio>
<script src="src/beatmap.js"></script>
<script src="build/lyrics.js"></script><!-- written by `node render.mjs --lyrics your.lrc`, never committed -->
<script src="src/timeline.js"></script>
<script src="src/paper.js"></script>
<script src="src/scenes.js"></script>
<script>
const cv = document.getElementById('c'), c2d = cv.getContext('2d');
window.renderFrame = t => drawFrame(c2d, t);
window.ready = (async () => { await document.fonts.load(`30px ${FONT}`, '小宇'); drawFrame(c2d, 0); })();
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const aud = document.getElementById('aud'), btn = document.getElementById('play');
  btn.onclick = () => { aud.currentTime = 0; aud.play(); btn.textContent = '↺ 重播'; };
  const loop = () => { drawFrame(c2d, aud.currentTime); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
