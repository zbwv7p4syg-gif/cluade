<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus 5.5 Edits</title>
<style>
  @font-face { font-family: Fredoka; src: url(assets/Fredoka-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Fredoka; src: url(assets/Fredoka-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; height: 100%; background: #0b0b10; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 700 18px Fredoka, sans-serif;
          padding: 10px 22px; border-radius: 999px; border: 0; background: #25e5d6; color: #0b0b10; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ Play with music</button>
<audio id="aud" src="build/music.wav" preload="auto"></audio>
<script>
// ============================================================================
//  Opus 5.5 × short-video editing — a 30 s one-take animation.
//  Everything is a pure function of time t (seconds). 120 BPM: a beat every 0.5 s.
// ============================================================================
const cv = document.getElementById('c'), mctx = cv.getContext('2d');
const VW = 1280, VH = 720, SS = cv.width / VW;
const off = document.createElement('canvas'); off.width = cv.width; off.height = cv.height;
const octx = off.getContext('2d');
let ctx = octx;
const FONT = 'Fredoka, "Noto Color Emoji", "DejaVu Sans", sans-serif';
const DUR = 30, BEAT = 0.5;

// ---------------------------------------------------------------- math utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t;
const lin = t => t;
const back = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const elastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2 * Math.PI / 3) + 1;
const pulse = (t, k = 9) => Math.exp(-(((t % BEAT) + BEAT) % BEAT) * k);
const within = (t, a, b) => t >= a && t < b;
const TAU = Math.PI * 2;
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
// keyframes: [[t, v0, v1, ..., ease?]] — ease applies to the segment ending at that key
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1).filter(v => typeof v === 'number');
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) {
      const e = typeof b[b.length - 1] === 'function' ? b[b.length - 1] : eio;
      const p = e(seg(t, a[0], b[0]));
      const out = [];
      for (let j = 1; j < a.length; j++) if (typeof a[j] === 'number') out.push(lerp(a[j], b[j], p));
      return out;
    }
  }
  return keys[keys.length - 1].slice(1).filter(v => typeof v === 'number');
}

// ---------------------------------------------------------------- palette
const C = {
  win: '#121219', panel: '#1b1b25', panel2: '#23232f', line: '#2f2f3d', dim: '#8b8ba3', white: '#f5f5fa',
  teal: '#25e5d6', pink: '#ff4d8d', yellow: '#ffd23f', purple: '#8b5cf6', orange: '#ff9f43', blue: '#4dabff',
  red: '#ff4757', green: '#2ed573',
  body: '#e8825c', bodyDk: '#cf6743', face: '#fff4e8', ink: '#1d1b2e',
};

// ---------------------------------------------------------------- drawing utils
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); ctx.fillStyle = fill; ctx.fill();
}
function txt(s, x, y, size, color, align = 'left', weight = 700, stroke = null, sw = 0) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function star4(x, y, r, fill, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.32 : r; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}

// ============================================================================
//  Layout of the (fictional, generic) editor UI in world units
// ============================================================================
const TL = { x0: 140, rulerY: 505, trackY: 560, trackH: 90, textY: 668, textH: 44, audioY: 730, audioH: 62 };
const PREV = { x: 500, y: 84, w: 600, h: 337.5 };
const BTN = {
  split: { x: 250, w: 100, label: '✂ Split' },
  trans: { x: 360, w: 150, label: '⇄ Transitions' },
  text:  { x: 620, w: 90, label: 'T  Text' },
  fx:    { x: 720, w: 110, label: '✦ Effects' },
  beat:  { x: 840, w: 135, label: '♪ Beat Sync' },
};
const BTN_Y = 450, BTN_H = 36;
const CLIP_COL = { cat: '#4dabff', load: '#6b6b80', skate: '#ff4d8d', pizza: '#ffb020', sunset: '#8b5cf6' };
const CLIP_NAME = { cat: 'cat.mp4', load: 'loading.mp4', skate: 'skate.mp4', pizza: 'pizza.mp4', sunset: 'sunset.mp4' };

// ============================================================================
//  Clip thumbnails (drawn in a 160×90 design box)
// ============================================================================
function catFace(cx, cy, r, t, laser = false) {
  const col = C.orange;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(cx - r * .9, cy - r * .3); ctx.lineTo(cx - r * .75, cy - r * 1.25); ctx.lineTo(cx - r * .2, cy - r * .85); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + r * .9, cy - r * .3); ctx.lineTo(cx + r * .75, cy - r * 1.25); ctx.lineTo(cx + r * .2, cy - r * .85); ctx.fill();
  circ(cx, cy, r, col);
  ell(cx, cy + r * .35, r * .55, r * .38, '#ffe0b8');
  const blink = (t % 2.7) < 0.12 ? 0.15 : 1;
  ell(cx - r * .38, cy - r * .12, r * .13, r * .19 * blink, C.ink);
  ell(cx + r * .38, cy - r * .12, r * .13, r * .19 * blink, C.ink);
  ell(cx, cy + r * .18, r * .1, r * .07, '#ff7aa2');
  ctx.strokeStyle = C.ink; ctx.lineWidth = r * .05;
  for (const s of [-1, 1]) for (const k of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(cx + s * r * .45, cy + r * .3); ctx.lineTo(cx + s * r * 1.15, cy + r * (.22 + k * .12)); ctx.stroke();
  }
  if (laser) {
    ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = r * .16; ctx.globalAlpha = .9;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + s * r * .38, cy - r * .12); ctx.lineTo(cx + s * r * 5, cy + r * 3); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
}
function thumb(kind, x, y, w, h, t, opt = {}) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.translate(x, y); ctx.scale(w / 160, h / 90);
  if (kind === 'cat') {
    ctx.fillStyle = '#7cc6fe'; ctx.fillRect(0, 0, 160, 90);
    ell(30, 20, 18, 8, 'rgba(255,255,255,.7)'); ell(130, 14, 14, 6, 'rgba(255,255,255,.6)');
    ctx.fillStyle = '#5fb86a'; ctx.fillRect(0, 76, 160, 14);
    catFace(80, 50 + Math.sin(t * 6) * 2.5, 22, t, opt.laser);
  } else if (kind === 'load') {
    ctx.fillStyle = '#3a3a48'; ctx.fillRect(0, 0, 160, 90);
    ctx.strokeStyle = '#9a9ab0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(80, 38, 13, t * 6, t * 6 + 4.2); ctx.stroke(); ctx.lineCap = 'butt';
    txt('Loading...', 80, 66, 13, '#b8b8cc', 'center', 600);
    txt('3:00:00', 150, 82, 9, '#8b8ba3', 'right', 600);
  } else if (kind === 'skate') {
    const g = ctx.createLinearGradient(0, 0, 160, 90); g.addColorStop(0, '#ff7ab8'); g.addColorStop(1, '#8b5cf6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 160, 90);
    ctx.fillStyle = '#2a2140'; ctx.fillRect(0, 74, 160, 16);
    ctx.fillStyle = '#ffd23f';
    for (let i = -1; i < 6; i++) ctx.fillRect(((i * 40 - t * 140) % 200 + 200) % 200 - 20, 81, 20, 3);
    const sx = 80 + Math.sin(t * 2.2) * 18, jump = Math.max(0, Math.sin(t * 4.4)) * 6;
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(sx - 36 - k * 6, 50 + k * 8); ctx.lineTo(sx - 52 - k * 10, 50 + k * 8); ctx.stroke(); }
    rr(sx - 26, 66 - jump, 52, 6, 3, '#ff9f43');
    circ(sx - 16, 74 - jump, 4, C.ink); circ(sx + 16, 74 - jump, 4, C.ink);
    catFace(sx, 46 - jump, 15, t);
  } else if (kind === 'pizza') {
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, 0, 160, 90);
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#ffc21a' : '#ffd23f'; ctx.beginPath(); ctx.moveTo(80, 45); ctx.arc(80, 45, 120, i * TAU / 8 + t, (i + 1) * TAU / 8 + t); ctx.fill(); }
    ctx.save(); ctx.translate(80, 45); ctx.rotate(Math.sin(t * 3) * 0.25);
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(-26, -24); ctx.quadraticCurveTo(0, -36, 26, -24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c8742e'; ctx.beginPath(); ctx.moveTo(-26, -24); ctx.quadraticCurveTo(0, -36, 26, -24); ctx.lineTo(24, -18); ctx.quadraticCurveTo(0, -29, -24, -18); ctx.fill();
    for (const [px, py] of [[-8, -10], [9, -6], [0, 10]]) circ(px, py, 5, '#e2403a');
    ctx.restore();
  } else if (kind === 'sunset') {
    const g = ctx.createLinearGradient(0, 0, 0, 90); g.addColorStop(0, '#6a3cc8'); g.addColorStop(.55, '#ff4d8d'); g.addColorStop(1, '#ff9a3c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 160, 90);
    circ(80, 62 - Math.sin(t) * 2, 22, '#ffd23f');
    ctx.fillStyle = '#3b1f6e'; ctx.fillRect(0, 62, 160, 28);
    ctx.fillStyle = 'rgba(255,210,63,.7)';
    for (let i = 0; i < 4; i++) { const ww = 34 - i * 6; ctx.fillRect(80 - ww / 2 + Math.sin(t * 3 + i) * 3, 67 + i * 6, ww, 2.5); }
  }
  ctx.restore();
}

// ============================================================================
//  Timeline state
// ============================================================================
const LAND = { cat: 2.0, load: 2.5, skate: 3.0, pizza: 3.5, sunset: 4.0 };
const ORDER = ['cat', 'load', 'skate', 'pizza', 'sunset'];
function mediaSlot(i) { return { x: 36 + (i % 3) * 138, y: 118 + Math.floor(i / 3) * 104, w: 126, h: 71 }; }
function clipLayout(t) {
  const out = [];
  const gap = eio(seg(t, 8.0, 8.5));         // loading clip removed -> close gap
  const snap = back(seg(t, 17.8, 18.1));      // beat sync -> uniform 280 widths
  const base = { cat: [140, 200], load: [340, 340], skate: [680, 200], pizza: [880, 200], sunset: [1080, 200] };
  const snapped = { cat: [140, 280], skate: [420, 280], pizza: [700, 280], sunset: [980, 280] };
  for (const k of ORDER) {
    let [x, w] = base[k];
    if (k !== 'cat' && k !== 'load') x -= 340 * gap;
    if (k !== 'load') { x = lerp(x, snapped[k][0], snap); w = lerp(w, snapped[k][1], snap); }
    const land = LAND[k];
    let y = TL.trackY, h = TL.trackH, rot = 0, fly = null, alpha = 1, sq = 0;
    if (t < land - 0.45) continue;
    if (t < land) { // arc from the media bin into its slot
      const p = seg(t, land - 0.45, land), m = mediaSlot(ORDER.indexOf(k));
      fly = { x: lerp(m.x, x, eio(p)), y: lerp(m.y, y, ein(p)) - Math.sin(p * Math.PI) * 170, w: lerp(m.w, Math.min(w, 200), p), h: lerp(m.h, h, p), rot: Math.sin(p * Math.PI) * 0.25 };
    } else {
      const d = t - land; sq = 0.22 * Math.exp(-d * 9) * Math.cos(d * 30);
    }
    if (k === 'load') {
      if (t > 7.0) {
        const p1 = seg(t, 7.0, 7.5);
        y -= 46 * eout(p1); rot = Math.sin(t * 22) * 0.04 * p1;
        if (t > 7.5) {
          const p = t - 7.5;
          x += -520 * p; y += -900 * p + 700 * p * p; rot = -5 * p;
          if (p > 1.4) continue;
        }
      }
    }
    out.push({ k, x, y, w, h, rot, fly, alpha, sq });
  }
  return out;
}
const JUNCTIONS = t => { const s = back(seg(t, 17.8, 18.1)); return [lerp(340, 420, s), lerp(540, 700, s), lerp(740, 980, s)]; };
const TRANS = [{ t: 9.0, g: '↻', c: C.teal }, { t: 9.5, g: '⇆', c: C.pink }, { t: 10.0, g: '⚡', c: C.yellow }];
const WORDS = [
  { t: 14.5, s: 'POV:', c: C.pink }, { t: 15.0, s: 'my', c: C.teal }, { t: 15.5, s: 'cat', c: C.orange },
  { t: 16.0, s: 'can', c: C.purple }, { t: 16.5, s: 'SKATE', c: C.yellow },
];
const playheadX = t => t < 20 ? 140 : t < 23.5 ? 140 + 1120 * seg(t, 20, 23.5) : 1260;

// ============================================================================
//  Opus 5.5 — the star
// ============================================================================
const PATH = [
  [4.2, 4.9, 720, 558, 370, 558, 'run'],
  [6.1, 6.85, 370, 558, 690, 558, 'run'],
  [7.25, 7.5, 690, 558, 705, 558, 'hop', 30],
  [8.0, 8.5, 705, 558, 365, 558, 'ride'],
  [8.6, 9.0, 365, 558, 340, 558, 'hop', 60],
  [9.05, 9.5, 340, 558, 540, 558, 'hop', 75],
  [9.55, 10.0, 540, 558, 740, 558, 'hop', 75],
  [11.5, 12.0, 740, 558, 775, 450, 'hop', 90],
  [14.05, 14.5, 775, 450, 665, 450, 'hop', 70],
  [16.55, 17.0, 665, 450, 907, 450, 'hop', 80],
  [19.4, 20.0, 907, 450, 140, 497, 'hop', 190],
  [20.0, 23.5, 140, 497, 1260, 497, 'ride'],
  [23.5, 24.0, 1260, 497, 1510, 8, 'hop', 130],
  [25.7, 26.0, 1510, 8, 1365, 214, 'hop', 70],
  [26.1, 26.5, 1365, 214, 1365, 322, 'hop', 70],
  [26.6, 27.0, 1365, 322, 1225, 444, 'hop', 70],
];
function opusPos(t) {
  let x = 720, y = 558, mode = 'idle', p = 0, gy = 558, dir = 1, air = 0;
  for (const s of PATH) {
    if (t < s[0]) break;
    const [t0, t1, x0, y0, x1, y1, type, hgt] = s;
    if (t >= t1) { x = x1; y = y1; gy = y1; mode = 'idle'; dir = x1 >= x0 ? 1 : -1; continue; }
    p = seg(t, t0, t1); mode = type; dir = x1 >= x0 ? 1 : -1;
    if (type === 'hop') {
      x = lerp(x0, x1, eio(p)); gy = lerp(y0, y1, p);
      air = 4 * p * (1 - p) * hgt; y = gy - air;
    } else if (type === 'run') { x = lerp(x0, x1, eio(p)); y = gy = y0; }
    else { x = lerp(x0, x1, type === 'ride' && t0 === 8.0 ? eio(p) : p); y = gy = y0; }
  }
  return { x, y, gy, mode, p, dir, air };
}
// windows where Opus bops on every beat (airborne between beats, lands on the beat)
const BOP = [[2.0, 4.2, 22], [10.0, 11.5, 16], [14.5, 16.5, 10], [18.0, 19.4, 18], [27.0, 30, 7]];

function opusState(t) {
  const P = opusPos(t);
  const o = { x: P.x, y: P.y, gy: P.gy, s: 0.9, dir: 1, sq: 0, tilt: 0, eyes: 'open', mouth: 'smile', armL: 0.35, armR: 0.35,
              prop: null, propOpen: 0, glasses: t >= 14.0 && t < 27.0 ? 'on' : t >= 27.0 ? 'up' : null, sweat: 0, leg: 0, pupil: 0 };
  o.dir = P.mode === 'idle' ? 1 : P.dir;
  // pop in
  if (t < 0.5) { const e = elastic(seg(t, 0, 0.5)); o.s *= e; }
  // blinking
  if ((t % 3.1) > 2.98) o.eyes = 'blink';
  // idle breathing / beat bops
  let bopH = 0;
  for (const [a, b, h] of BOP) if (within(t, a, b)) {
    const f = ((t - a) % BEAT) / BEAT; bopH = h * 4 * f * (1 - f);
    o.sq = 0.12 * Math.exp(-f * 12) - 0.05 * Math.sin(f * Math.PI);
  }
  if (P.mode === 'idle') o.y -= bopH;
  if (P.mode === 'hop') { const p = P.p; o.sq = p < 0.15 ? 0.15 * (1 - p / 0.15) : -0.08 * Math.sin(p * Math.PI); o.armL = o.armR = 2.4; o.mouth = 'open'; }
  if (P.mode === 'run') { o.leg = t * 26; o.armL = 0.6 + Math.sin(t * 26) * 0.6; o.armR = 0.6 - Math.sin(t * 26) * 0.6; o.tilt = 0.12 * P.dir; o.mouth = 'grin'; }
  // landing squash for 0.15 s after any hop
  for (const s of PATH) if (s[6] === 'hop' && within(t, s[1], s[1] + 0.2)) o.sq = Math.max(o.sq, 0.2 * (1 - seg(t, s[1], s[1] + 0.2)));

  // ---- act by act
  if (t < 2.0) { o.mouth = t < 1.6 ? 'open' : 'smile'; o.armR = 2.5 + Math.sin(t * 14) * 0.35; }
  if (within(t, 2.0, 4.2)) { o.eyes = 'happy'; const b = Math.floor((t - 2) / BEAT) % 2; o.armL = b ? 2.7 : 0.5; o.armR = b ? 0.5 : 2.7; o.mouth = 'open'; }
  if (within(t, 4.9, 6.1)) { // bored by the loading screen
    o.eyes = within(t, 5.0, 5.6) ? 'sleepy' : 'open'; o.mouth = within(t, 5.0, 5.6) ? 'yawn' : 'flat';
    o.armL = within(t, 5.0, 5.6) ? 2.9 : 0.35; o.armR = 2.9;
  }
  if (t >= 5.6 && t < 7.4) { o.prop = 'scissors'; o.armR = 2.6; }
  if (within(t, 5.6, 5.9)) o.propPop = seg(t, 5.6, 5.9);
  for (const sn of [6.0, 7.0]) if (within(t, sn - 0.2, sn + 0.25)) { o.propOpen = t < sn ? seg(t, sn - 0.2, sn) : 1 - seg(t, sn, sn + 0.08); o.armR = t < sn ? 2.9 : 1.6; o.mouth = 'grin'; o.eyes = t >= sn ? 'happy' : 'open'; }
  if (within(t, 6.1, 6.85)) { o.propOpen = 0.3; o.armR = 2.4; }
  if (within(t, 7.0, 7.5)) { o.dir = -1; o.eyes = 'open'; o.mouth = 'o'; o.pupil = -1; }
  if (within(t, 7.5, 8.0)) { o.dir = -1; o.armR = 1.9; o.armL = 2.6; o.mouth = 'grin'; o.eyes = 'happy'; o.tilt = -0.15; }
  if (within(t, 8.0, 8.5)) { o.dir = -1; o.armL = o.armR = 2.8; o.mouth = 'open'; o.tilt = -0.1; }
  for (const tr of TRANS) if (within(t, tr.t, tr.t + 0.2)) { o.armL = o.armR = 2.9; o.eyes = 'happy'; }
  if (within(t, 10.0, 11.5)) { o.eyes = 'happy'; o.mouth = 'grin'; const b = Math.floor((t - 10) / BEAT) % 2; o.tilt = b ? 0.12 : -0.12; o.armL = b ? 2.8 : 1.2; o.armR = b ? 1.2 : 2.8; }
  // the sneeze
  if (within(t, 12.0, 12.5)) { const p = seg(t, 12.0, 12.5); o.tilt = -0.25 * eout(p); o.eyes = 'squint'; o.mouth = 'o'; o.armL = 0.9; o.armR = 0.9; o.sq = -0.1 * p; }
  if (within(t, 12.5, 13.0)) { o.tilt = 0.3 * Math.exp(-(t - 12.5) * 6) + Math.sin(t * 60) * 0.06; o.eyes = t < 12.62 ? 'shut' : 'dizzy'; o.mouth = t < 12.62 ? 'open' : 'wobble'; o.armR = 2.3; o.armL = 1.4; o.sq = 0.18 * Math.exp(-(t - 12.5) * 10); }
  if (within(t, 13.0, 14.0)) { o.eyes = 'dizzy'; o.mouth = 'wobble'; o.armL = 1.2; o.armR = 1.4; }
  if (within(t, 14.0, 14.5)) { o.mouth = 'smug'; }
  if (within(t, 14.5, 17.0)) {
    o.mouth = 'smug'; const f = ((t - 14.5) % BEAT) / BEAT;
    if (t < 16.5) { o.armR = f < 0.3 ? 1.2 : 2.6; o.armL = 0.5; }
  }

function sceneTime(t) {

  if (t < 13.0 || t >= 14.0) return t;
  const tau = Math.min(t - 13.0, 0.5);
  return 13.0 + tau - tau * tau;
}

  render(0);
})();
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const aud = document.getElementById('aud'), btn = document.getElementById('play');
  let start = null, useAudio = false;
  btn.onclick = async () => {
    try { aud.currentTime = 0; await aud.play(); useAudio = true; } catch (e) { useAudio = false; }
    start = performance.now(); btn.textContent = '↺ Replay';
  };
  const loop = () => {
    if (start !== null) {
      const t = useAudio ? aud.currentTime : (performance.now() - start) / 1000;
      render(Math.min(t, DUR - 1e-4));
    }
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
