<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后室 · Level 0</title>
<style>
  @font-face { font-family: KuaiLe; src: url(assets/zcool-kuaile-subset.woff2); }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 700 18px KuaiLe, sans-serif;
          padding: 10px 24px; border-radius: 999px; border: 0; background: #E8D58A; color: #2a2410; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 播放</button>
<script src="src/world.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script>
const cv = document.getElementById('c'), c2d = cv.getContext('2d');
window.renderFrame = t => drawFrame(c2d, t);
window.ready = (async () => { await document.fonts.load('40px KuaiLe', '后室没有出口'); makeTextures(); makeSprites(); makeFilm(); drawFrame(c2d, 0); })();
window.renderAudioBase64 = async () => {
  const buf = await renderSoundtrack(44100), L = buf.getChannelData(0), R = buf.getChannelData(1);
  // normalise to the 99.9th percentile and soft-clip the odd click that sticks out above it
  const hist = new Uint32Array(1001); for (let i = 0; i < L.length; i += 3) hist[Math.min(1000, Math.round(Math.max(Math.abs(L[i]), Math.abs(R[i])) * 1000))]++;
  let acc = 0, p999 = 1; for (let i = 1000; i >= 0; i--) { acc += hist[i]; if (acc > L.length / 3 * .001) { p999 = Math.max(.05, i / 1000); break; } }
  const k = .72 / p999, soft = x => { x *= k; const a = Math.abs(x); return Math.sign(x) * (a < .72 ? a : .72 + .2 * Math.tanh((a - .72) / .2)); }, pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { pcm[2 * i] = soft(L[i]) * 32767; pcm[2 * i + 1] = soft(R[i]) * 32767; }
  const bytes = new Uint8Array(pcm.buffer); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const btn = document.getElementById('play'); let ac = null, buffer = null, t0 = 0;
  btn.onclick = async () => { btn.textContent = '合成声音中…'; buffer = buffer || await renderSoundtrack(44100); ac = ac || new AudioContext();
    const src = ac.createBufferSource(); src.buffer = buffer; src.connect(ac.destination); t0 = ac.currentTime + .05; src.start(t0); btn.textContent = '↺ 重播'; };
  const loop = () => { if (ac) drawFrame(c2d, Math.min(DUR, ac.currentTime - t0)); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
