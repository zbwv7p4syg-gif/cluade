<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 听见了音乐</title>
<style>
  @font-face { font-family: Fredoka; src: url(assets/Fredoka-Bold.ttf); font-weight: 700; }
  @font-face { font-family: NotoSC; src: url(assets/noto-sans-sc-subset.woff2); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
  #play { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font: 700 18px NotoSC, sans-serif;
          padding: 10px 24px; border-radius: 999px; border: 0; background: #D97757; color: #fff; cursor: pointer; }
  body.render #play { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ 播放</button>
<audio id="aud" src="build/bgm.wav" preload="auto"></audio>
<script src="src/beatmap.js"></script>
<script src="src/clawd.js"></script>
<script src="src/visuals.js"></script>
<script>
const cv = document.getElementById('c'), c2d = cv.getContext('2d'), SCALE = cv.width / VW;
window.renderFrame = t => drawFrame(c2d, t, SCALE);
window.ready = (async () => { await Promise.all(['700 30px Fredoka', '700 30px NotoSC'].map(f => document.fonts.load(f, 'Claude 听'))); drawFrame(c2d, 0, SCALE); })();
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const aud = document.getElementById('aud'), btn = document.getElementById('play');
  btn.onclick = () => { aud.currentTime = 0; aud.play(); btn.textContent = '↺ 重播'; };
  const loop = () => { drawFrame(c2d, aud.currentTime, SCALE); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
